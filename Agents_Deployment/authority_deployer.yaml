project: default
source:
  repoURL: https://code.europa.eu/api/v4/projects/902/packages/helm/stable
  path: '""'
  targetRevision: 2.4.1
  helm:
    values: >
      values:
        branch: v2.4.1                 # branch of repo with values - for released version it should be the release branch
      project: default                    # Project to which the namespace is
      attached

      namespaceTag:
        authority: authority01            # identifier of deployment and part of fqdn for this agent
        common: common01                 # identifier of deployment and part of fqdn for common components
      domainSuffix: ibtourismdataspace.org          # last part of fqdn

      resourcePreset: low             # set to "low" to disable requests of
      resources

      argocd:
        appname: authority01              # name of generated argocd app
        namespace: argocd                 # namespace of your argocd
      cluster:
        address: https://kubernetes.default.svc
        namespace: authority01             # where the app will be deployed
        commonToolsNamespace: common01      # namespace where main monitoring stack is deployed
        issuer: letsencrypt-azure             # certificate issuer name
      secrets:
        role: common01-role                # role created in OpenBao for access
        secretEngine: common01            # container for secrets in your OpenBao
      monitoring:
        enabled: false                     # you can set it to false if you don't have common monitoring stack
  chart: authority
destination:
  server: https://kubernetes.default.svc
  namespace: authority01
